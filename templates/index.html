<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FlowSight Operations Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-logo" aria-label="FlowSight logo">
        <svg width="44" height="44" viewBox="0 0 92 72" fill="none" aria-hidden="true">
          <path d="M8 18C20 18 22 8 36 8C49 8 59 18 70 18" stroke="#12B85E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 34C28 27 40 24 50 28C58 31 63 37 67 42" stroke="#58D8B4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 48C20 48 26 58 38 58C52 58 58 45 70 45" stroke="#0F6A43" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>FlowSight</span>
      </div>
      <small>Predict the crowd. Shape the flow.</small>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </aside>
  <main class="main" id="main">
    <header class="top">
      <h1 id="pageTitle">Overview</h1>
      <span class="live"><i></i>Live</span>
      <span class="sub" id="demoTime">Demo time · 17:45</span>
      <div class="right">
        <select id="timeSelect" class="btn sm" aria-label="Prototype time">
          <option value="17:45">17:45</option>
          <option value="18:00">18:00</option>
          <option value="18:15">18:15</option>
          <option value="19:00">19:00</option>
        </select>
        <span class="chip-fc"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Forecast horizon: 15 min</span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
